# Keeps the node issues in step with the tech tree on the website.
# Builds the tree data from the website repo, then creates/updates issues, labels and text here.
# It never changes assignees and never moves a claimed or finished node back (see scripts/sync-issues.mjs).
name: Sync tech tree issues

on:
  schedule:
    - cron: '17 5 * * *' # daily, 05:17 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

# Don't run twice at once; let a running sync finish.
concurrency:
  group: sync-issues
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: techtree
      - uses: actions/checkout@v4
        with:
          repository: joinoasa/website
          path: website
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Build the tree data. GITHUB_ACTIONS is set automatically, so the build also reads
      # live claim status from this repo's issues (public API; the token only raises the rate limit).
      - name: Build tech tree data
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-techtree.mjs
      - name: Sync issues
        working-directory: techtree
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-issues.mjs --data ../website/src/data/techtree.json --repo joinoasa/techtree
